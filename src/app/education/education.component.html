<h2 class="section-title">Formación Académica</h2>
<div *ngFor="let edu of educationList" class="mb-4 p-3 rounded" style="background-color: #fcfcfc; border-left: 4px solid var(--primary-green);">
  <div class="d-flex justify-content-between">
    <h3 class="item-title" style="font-size: 1.2rem;">{{ edu.programa }}</h3>
    <span class="fw-bold" style="color: var(--primary-green);">{{ edu.startDate }} — {{ edu.endDate }}</span>
  </div>
  <div class="item-subtitle text-dark fw-bold">{{ edu.institucion }}</div>
  <div class="d-flex justify-content-between mt-2 small text-muted">
    <span><i class="bi bi-geo-alt"></i> {{ edu.ubicacion }}</span>
    <span class="badge bg-success">{{ edu.estado }}</span>
  </div>
</div>
